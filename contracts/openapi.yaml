openapi: 3.1.0
info:
  title: Product custom API
  version: 1.2.0
  description: >
    Custom routes served under /v1. PocketBase's own /api/* endpoints are NOT
    described here; clients reach them through the SDK (which wraps the
    PocketBase JS SDK).
servers:
  - url: https://{tenant}.app.example.com
    variables:
      tenant:
        default: acme
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /v1/config:
    get:
      operationId: getConfig
      summary: Public tenant configuration for clients
      responses:
        "200":
          description: Tenant config (no secrets)
          content:
            application/json:
              schema:
                $ref: ./schemas/app-config.json
  /v1/features:
    get:
      operationId: getFeatures
      summary: Per-tenant feature flags and non-secret options
      description: Requires a signed-in user.
      security:
        - pocketbaseToken: []
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                $ref: ./schemas/features.json
        "401":
          description: Missing or invalid auth token
  /v1/schemas:
    get:
      operationId: listSchemas
      summary: List all business schemas
      description: Requires a signed-in user.
      security:
        - pocketbaseToken: []
      responses:
        "200":
          description: List of business schemas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas/schema-definition.json
        "401":
          description: Missing or invalid auth token
    post:
      operationId: createSchema
      summary: Create a new business schema
      description: Requires a signed-in user.
      security:
        - pocketbaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/schema-definition.json
      responses:
        "200":
          description: The created schema definition
          content:
            application/json:
              schema:
                $ref: ./schemas/schema-definition.json
        "400":
          description: Invalid schema definition
        "401":
          description: Missing or invalid auth token
  /v1/schemas/{id}:
    get:
      operationId: getSchema
      summary: Get a business schema by ID
      description: Requires a signed-in user.
      security:
        - pocketbaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The schema definition
          content:
            application/json:
              schema:
                $ref: ./schemas/schema-definition.json
        "404":
          description: Schema not found
        "401":
          description: Missing or invalid auth token
    delete:
      operationId: deleteSchema
      summary: Delete a business schema by ID
      description: Requires a signed-in user.
      security:
        - pocketbaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "404":
          description: Schema not found
        "401":
          description: Missing or invalid auth token
  /v1/payments/checkout:
    post:
      operationId: createCheckout
      summary: Start (or resume, or replay) a payment for an order
      description: >
        Requires the payments feature and a signed-in user. Retrying with the same
        idempotency_key returns the same payment without creating a second charge.
      security:
        - pocketbaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/payments/checkout-request.json
      responses:
        "200":
          description: The payment record
          content:
            application/json:
              schema:
                $ref: ./schemas/payments/payment.json
        "400":
          description: Invalid request or provider not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in
        "403":
          description: Payments feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Read one of your own payments
      security:
        - pocketbaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The payment record
          content:
            application/json:
              schema:
                $ref: ./schemas/payments/payment.json
        "401":
          description: Not signed in
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/webhooks/payments/{provider}:
    post:
      operationId: receivePaymentWebhook
      summary: Webhook called by a payment provider
      description: >
        Authenticated by the provider signature over the raw body, not by a user token.
        Duplicate deliveries are harmless.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Accepted (including duplicate deliveries)
        "400":
          description: Invalid signature or payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/workspace/setup:
    post:
      operationId: setupWorkspace
      summary: One-time first owner initialization
      description: Requires valid operator setup token. Permanently closes setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/workspace-setup-request.json
      responses:
        "200":
          description: Workspace initialized and owner created
          content:
            application/json:
              schema:
                $ref: ./schemas/workspace-user.json
        "401":
          description: Invalid setup token
        "409":
          description: Workspace is already initialized
  /v1/workspace/users:
    get:
      operationId: listWorkspaceUsers
      summary: List all workspace users and their permissions
      security:
        - pocketbaseToken: []
      responses:
        "200":
          description: List of workspace users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas/workspace-user.json
        "403":
          description: Owner or admin role required
  /v1/workspace/users/{id}:
    patch:
      operationId: updateWorkspaceUser
      summary: Update a workspace user's role or permissions
      security:
        - pocketbaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated workspace user
          content:
            application/json:
              schema:
                $ref: ./schemas/workspace-user.json
        "403":
          description: Owner or admin role required
  /v1/workspace/invitations:
    get:
      operationId: getWorkspaceInvitations
      summary: List pending invitations for the workspace
      security:
        - pocketbaseToken: []
      responses:
        "200":
          description: List of pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas/workspace-invitation.json
        "403":
          description: Owner or admin role required
    post:
      operationId: createInvitation
      summary: Invite a new member or admin to the workspace
      security:
        - pocketbaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/workspace-invitation.json
      responses:
        "200":
          description: Created invitation
          content:
            application/json:
              schema:
                $ref: ./schemas/workspace-invitation.json
        "403":
          description: Owner or admin role required
  /v1/workspace/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation to join the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password]
              properties:
                token:
                  type: string
                name:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Invitation accepted, user created
          content:
            application/json:
              schema:
                $ref: ./schemas/workspace-user.json
        "400":
          description: Invalid, expired, or revoked invitation token
  /v1/workspace/invitations/{id}/reissue:
    post:
      operationId: reissueInvitation
      summary: Reissue a fresh invitation token for an unaccepted invitation
      security:
        - pocketbaseToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reissued invitation token
          content:
            application/json:
              schema:
                $ref: ./schemas/workspace-invitation.json
        "403":
          description: Forbidden - admin cannot reissue admin invitations
        "404":
          description: Invitation not found
  /v1/workspace/permissions:
    get:
      operationId: getMyPermissions
      summary: Get the current authenticated user's role and permissions
      security:
        - pocketbaseToken: []
      responses:
        "200":
          description: Current user role and permissions
          content:
            application/json:
              schema:
                type: object
                required: [user_id, role, permissions]
                properties:
                  user_id:
                    type: string
                  role:
                    type: string
                  permissions:
                    type: object
components:
  securitySchemes:
    pocketbaseToken:
      type: apiKey
      in: header
      name: Authorization
      description: PocketBase auth token obtained by signing in.
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
