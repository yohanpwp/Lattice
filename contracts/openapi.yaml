openapi: 3.1.0
info:
  title: Product custom API
  version: 1.1.0
  description: >
    Implemented M0-M2 routes served under /v1. Payment endpoints are deferred
    to M4 and are intentionally absent until the backend implements them.
    PocketBase's own /api/* endpoints are NOT
    described here; clients reach them through the SDK (which wraps the
    PocketBase JS SDK).
servers:
  - url: https://{tenant}.app.example.com
    variables:
      tenant:
        default: acme
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /v1/config:
    get:
      operationId: getConfig
      summary: Public tenant configuration for clients
      responses:
        "200":
          description: Tenant config (no secrets)
          content:
            application/json:
              schema:
                $ref: ./schemas/app-config.json
  /v1/features:
    get:
      operationId: getFeatures
      summary: Per-tenant feature flags and non-secret options
      description: Requires a signed-in user.
      security:
        - pocketbaseToken: []
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema:
                $ref: ./schemas/features.json
        "401":
          description: Missing or invalid auth token
components:
  securitySchemes:
    pocketbaseToken:
      type: apiKey
      in: header
      name: Authorization
      description: PocketBase auth token obtained by signing in.
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
